<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>데일리뉴스</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:#222;background:#fff;line-height:1.5;font-size:14px;letter-spacing:-.2px}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
ul,ol{list-style:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
/* 상단 유틸 */
.util{border-bottom:1px solid #e5e5e5;font-size:12px;color:#666}
.util .wrap{display:flex;justify-content:space-between;height:30px;align-items:center}
.util ul{display:flex;gap:14px}
/* 로고 */
.logo-row{display:flex;justify-content:space-between;align-items:center;padding:18px 0 14px}
.logo{font-size:30px;font-weight:900;letter-spacing:-2px;color:#1b7a3d}
.logo em{font-style:normal;color:#2e9e52}
.search{border:1px solid #bbb;display:flex;height:30px}
.search input{border:0;padding:0 8px;width:170px;font-size:13px;outline:0}
.search button{border:0;background:#1b7a3d;color:#fff;padding:0 12px;font-size:12px}
/* 메뉴 */
nav{border-top:2px solid #1b7a3d;border-bottom:1px solid #ccc;overflow-x:auto}
nav ul{display:flex;white-space:nowrap}
nav a{display:block;padding:10px 14px;font-weight:700;font-size:15px}
nav li:first-child a{color:#2e9e52}
/* 속보 */
.latest{border-bottom:1px solid #e5e5e5;font-size:13px}
.latest .wrap{display:flex;gap:10px;height:34px;align-items:center}
.latest b{color:#2e9e52;flex:none}
#ticker{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* 본문 레이아웃 */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;padding:20px 0 10px}
.side{border-left:1px solid #e5e5e5;padding-left:24px}
/* 사진 */
.ph{background:#d9dcdf;position:relative;overflow:hidden}
.ph:after{content:"";position:absolute;left:50%;top:50%;width:28%;max-width:44px;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid #b8bcc0;border-radius:50%;opacity:.8}
.ph.has:after{display:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.r169{aspect-ratio:16/9}.r43{aspect-ratio:4/3}
.cap{font-size:12px;color:#777;margin-top:4px}
/* 헤드라인 */
.top-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;padding-bottom:18px;border-bottom:1px solid #ddd}
.big h1{font-size:27px;line-height:1.3;font-weight:800;margin:10px 0 8px;letter-spacing:-1px}
.big p{color:#555;font-size:14px;line-height:1.6}
.time{color:#999;font-size:12px;margin-top:6px}
.sub li{padding:10px 0;border-bottom:1px solid #eee;display:flex;gap:10px}
.sub li:first-child{padding-top:0}
.sub .ph{width:96px;flex:none}
.sub a{font-size:15px;font-weight:700;line-height:1.4}
.sub .time{margin-top:3px}
/* 섹션 */
.sec{padding:16px 0;border-bottom:1px solid #ddd}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sec-h h2{font-size:17px;font-weight:800;border-left:4px solid #1b7a3d;padding-left:8px;line-height:1}
.sec-h a{font-size:12px;color:#888}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cols3 h3{font-size:15px;font-weight:700;line-height:1.4;margin-top:6px}
.txt li{padding:7px 0;border-top:1px solid #eee;font-size:14px}
.txt li:before{content:"·";margin-right:5px;color:#999}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.row li{display:flex;gap:10px;padding:9px 0;border-top:1px solid #eee}
.row li:first-child{border-top:0;padding-top:0}
.row .ph{width:110px;flex:none}
.row a{font-weight:700;font-size:15px;line-height:1.4}
.row p{font-size:13px;color:#777;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 사이드 */
.rank li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.rank b{color:#2e9e52;width:14px;flex:none}
.rank li:nth-child(n+4) b{color:#333}
.photo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo p{font-size:12px;line-height:1.35;margin-top:3px}
/* 광고 */
.ad{position:relative;text-align:center;margin:14px 0}
.ad img{max-width:100%;height:auto;display:inline-block}
.ad .label{position:absolute;top:0;right:0;background:#fff;border:1px solid #ccc;color:#777;font-size:10px;padding:0 4px}
.ad-placeholder{background:#f1f1f1;color:#aaa;display:flex;align-items:center;justify-content:center;font-size:12px;border:1px solid #e0e0e0;margin:0 auto}
/* 푸터 */
footer{background:#f3f3f3;border-top:1px solid #ccc;margin-top:24px;font-size:12px;color:#666}
.f-links{border-bottom:1px solid #ddd;background:#fff}
.f-links ul{display:flex;flex-wrap:wrap;gap:4px 18px;padding:12px 0}
.f-links a{color:#333;font-weight:700}
.f-links li:nth-child(2) a{color:#2e9e52}
.f-main{display:grid;grid-template-columns:1.8fr 1fr 1fr 1fr;gap:24px;padding:22px 0}
.f-main h4{color:#333;font-size:13px;margin-bottom:8px}
.f-main li{padding:2px 0}
.f-logo{font-size:22px;font-weight:900;letter-spacing:-1.5px;color:#1b7a3d;margin-bottom:8px}.f-logo em{font-style:normal;color:#2e9e52}
.f-info{line-height:1.75}
.f-sns{display:flex;gap:6px;margin-top:10px}
.f-sns a{border:1px solid #bbb;background:#fff;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:11px}
.f-bottom{border-top:1px solid #ddd;padding:14px 0 22px;line-height:1.7;color:#888}
@media(max-width:860px){
 .layout{grid-template-columns:1fr}.side{border:0;padding:0}
 .top-grid,.cols2{grid-template-columns:1fr}.cols3{grid-template-columns:1fr 1fr}
 .big h1{font-size:22px}.f-main{grid-template-columns:1fr 1fr}.search{display:none}
}
.a-cat{color:#2e9e52;font-weight:800;font-size:14px;margin-top:6px}
.a-title{font-size:30px;line-height:1.3;font-weight:800;letter-spacing:-1px;margin:6px 0 10px}
.a-meta{display:flex;justify-content:space-between;align-items:center;color:#777;font-size:13px;padding:10px 0;border-top:1px solid #ddd;border-bottom:1px solid #ddd;margin-bottom:16px}
.a-meta button{border:1px solid #bbb;background:#fff;padding:4px 10px;font-size:12px;cursor:pointer}
.a-body p{font-size:17px;line-height:1.85;margin:0 0 18px;word-break:keep-all}
.a-sub{font-size:16px;color:#555;border-left:3px solid #1b7a3d;padding-left:10px;margin:0 0 16px;line-height:1.6}
.a-end{color:#888;font-size:12px;margin:8px 0 14px}
.a-back{display:inline-block;margin:10px 0;border:1px solid #1b7a3d;color:#1b7a3d;padding:6px 14px;font-weight:700}
@media(max-width:860px){.a-title{font-size:23px}.a-body p{font-size:16px}}
</style>
</head>
<body>

<div class="util"><div class="wrap"><span id="today"></span></div></div>
<div class="wrap">
 <div class="logo-row">
  <a class="logo" href="#/">데일리<em>뉴스</em></a>
  <form class="search" onsubmit="return false"><input placeholder="검색어를 입력하세요"><button>검색</button></form>
 </div>
</div>
<nav><div class="wrap"><ul id="menu"></ul></div></nav>
<div class="latest"><div class="wrap"><b>최신뉴스</b><div id="ticker"></div></div></div>

<div class="wrap">
 <!-- 광고 슬롯: 상단 배너 -->

 <div class="layout">
  <main>
   <div id="home"><section id="headline"></section>

   <section class="sec"><div class="sec-h"><h2>정치·경제</h2><a href="#/c/정치·경제">더보기 &gt;</a></div><div class="cols3" id="biz"></div></section>
   <section class="sec"><div class="sec-h"><h2>사회</h2><a href="#/c/사회">더보기 &gt;</a></div><ul class="row" id="soc"></ul></section>
   <div class="cols2">
    <section class="sec"><div class="sec-h"><h2>연예·스포츠</h2><a href="#/c/연예·스포츠">더보기 &gt;</a></div><ul class="txt" id="ent"></ul></section>
    <section class="sec"><div class="sec-h"><h2>취재파일</h2><a href="#/c/취재파일">더보기 &gt;</a></div><ul class="txt" id="cov"></ul></section>
   </div>

  </aside>
 </div>
</div>

<footer>
 <div class="f-links"><div class="wrap"><ul id="f-links"></ul></div></div>
 <div class="wrap">
  <div class="f-main">
   <div><div class="f-logo">데일리<em>뉴스</em></div><div class="f-info" id="f-info"></div><div class="f-sns" id="f-sns"></div></div>
   <div><h4>뉴스</h4><ul id="f-news"></ul></div>
   <div><h4>고객센터</h4><ul id="f-cs"></ul></div>
   <div><h4>제휴·광고</h4><ul id="f-biz"></ul></div>
  </div>

 </div>
</footer>

<script type="module">
/* =====================================================================
   1) 광고 설정  ← 광고는 여기만 수정하세요
   slot: HTML 의 data-slot 과 같은 이름 / enabled:false 면 숨김
   type: "image"(이미지) 또는 "html"(애드센스 등 코드)
   image: 이미지 경로  link: 클릭 주소  width/height: 크기(px)
   ▼ 기사 페이지 전용 슬롯: article-top(제목 아래) / article-mid(본문 중간) / article-bottom(본문 끝)
   본문 중간 광고 위치: 아래 ARTICLE_AD_AFTER (몇 번째 문단 뒤에 넣을지)
   ===================================================================== */
const ARTICLE_AD_AFTER = 2;
const ADS = [
  {slot:"top-banner",     enabled:true, type:"image", image:"", link:"https://example.com", alt:"상단 배너 광고", width:970, height:90},
  {slot:"mid-banner",     enabled:true, type:"image", image:"", link:"https://example.com", alt:"중간 배너 광고", width:728, height:90},
  {slot:"bottom-banner",  enabled:true, type:"image", image:"", link:"https://example.com", alt:"하단 배너 광고", width:728, height:90},
  {slot:"side-1",         enabled:true, type:"image", image:"", link:"https://example.com", alt:"사이드 광고 1",  width:300, height:250},
  {slot:"side-2",         enabled:true, type:"html",  html:"", width:300, height:250},
  {slot:"article-top",    enabled:true, type:"image", image:"", link:"https://example.com", alt:"기사 상단 광고", width:728, height:90},
  {slot:"article-mid",    enabled:true, type:"image", image:"", link:"https://example.com", alt:"기사 중간 광고", width:728, height:120},
  {slot:"article-bottom", enabled:true, type:"image", image:"", link:"https://example.com", alt:"기사 하단 광고", width:728, height:90}
];

/* =====================================================================
   2) 기사 모음  ← 기사는 여기에 추가·수정하세요 (전부 가상의 예시)
   id: 겹치지 않는 영문/숫자 이름   cat: 분류   t: 제목   s: 한 줄 요약(목록·부제)
   time: 입력 시각   rep: 기자명   img: 대표 이미지 경로(없으면 빈칸)   cap: 사진 설명
   body: 본문 — 문단 하나가 문자열 하나. 쉼표로 이어서 추가
   ===================================================================== */
let ARTICLES = [
 {id:"a1",cat:"사회",t:"지역 축제 사흘간 20만 명 몰려…주변 상권 '활기'",s:"인근 상인들은 지난해보다 매출이 크게 늘었다고 입을 모았다.",time:"2026.10.13 09:12",rep:"홍길동",img:"",cap:"▲ 사진 설명이 들어가는 자리 (사진=데일리뉴스)",
  body:["지난 10일부터 사흘간 열린 지역 축제에 20만 명이 넘는 방문객이 찾은 것으로 집계됐다. 주최 측은 13일 이 같은 내용을 밝혔다.","인근 상인들은 지난해보다 매출이 크게 늘었다고 입을 모았다. 한 음식점 주인은 \"주말 내내 대기 줄이 이어졌다\"고 말했다.","주최 측은 내년에는 행사 기간을 하루 더 늘리는 방안을 검토 중이다. 주차 공간 부족과 교통 혼잡은 보완 과제로 꼽혔다.","※ 이 기사는 가상의 예시입니다."]},
 {id:"a2",cat:"사회",t:"올가을 첫 한파주의보…내일 아침 영하권",s:"중부 내륙은 기온이 영하로 떨어질 전망이다.",time:"2026.10.13 09:05",rep:"김민수",img:"",cap:"",body:["기상 당국은 내일 아침 중부 내륙을 중심으로 올가을 첫 한파주의보를 발령할 예정이라고 밝혔다.","아침 최저기온은 영하 3도에서 영상 5도 사이로 예상된다. 낮에는 기온이 올라 일교차가 15도 이상 벌어지겠다.","당국은 노약자와 어린이의 건강 관리와 농작물 냉해 예방에 신경 써 달라고 당부했다."]},
 {id:"a3",cat:"사회",t:"시내버스 노선 개편 시작, 달라지는 점은",s:"환승 체계가 단순해지고 배차 간격이 줄어든다.",time:"2026.10.13 08:48",rep:"이서연",img:"",cap:"",body:["이번 달부터 시내버스 노선이 개편됐다. 중복 구간을 줄이고 환승 체계를 단순하게 바꾸는 것이 핵심이다.","출퇴근 시간대 배차 간격은 평균 3분 줄어든다. 일부 노선은 번호가 바뀌어 이용 전 확인이 필요하다.","시는 한 달간 안내 요원을 주요 정류장에 배치해 이용객 혼선을 줄이겠다고 밝혔다."]},
 {id:"a4",cat:"사회",t:"청년 일자리 사업 신청 접수 시작",s:"만 19세에서 34세 대상, 다음 달 말까지 접수한다.",time:"2026.10.13 08:30",rep:"박지훈",img:"",cap:"",body:["지자체가 청년 일자리 사업 참여자 모집을 시작했다. 만 19세에서 34세 미취업 청년이 대상이다.","접수는 다음 달 말까지이며 온라인으로 신청할 수 있다. 선발된 청년은 6개월간 지역 기업에서 근무하며 급여를 받는다.","자세한 자격 요건은 담당 부서 누리집에서 확인할 수 있다."]},
 {id:"a5",cat:"경제",t:"소비자물가 석 달 만에 상승 폭 둔화",s:"농산물 가격이 안정세를 보인 영향이다.",time:"2026.10.13 08:40",rep:"최유진",img:"",cap:"",body:["이달 소비자물가 상승률이 석 달 만에 둔화한 것으로 나타났다. 농산물 가격이 안정세를 보인 영향이 컸다.","다만 외식비와 공공요금은 오름세가 이어지고 있어 체감 물가는 여전히 높다는 평가가 나온다.","전문가들은 연말까지 완만한 둔화 흐름이 이어질 것으로 내다봤다."]},
 {id:"a6",cat:"정치",t:"국회, 내일 예산안 심사 착수",s:"여야는 증액 규모를 두고 입장차를 보이고 있다.",time:"2026.10.13 08:15",rep:"정하늘",img:"",cap:"",body:["국회가 내일부터 내년도 예산안 심사에 들어간다. 여야는 복지와 연구개발 예산 증액 규모를 두고 입장차를 보이고 있다.","각 상임위원회는 부처별 예산을 차례로 살펴볼 예정이다. 처리 시한은 다음 달 말이다."]},
 {id:"a7",cat:"경제",t:"수출 증가세 이어져…반도체 호조",s:"반도체와 자동차가 전체 증가세를 이끌었다.",time:"2026.10.13 07:50",rep:"오세진",img:"",cap:"",body:["이달 들어 열흘간 수출이 전년 같은 기간보다 증가했다. 반도체와 자동차가 증가세를 이끌었다.","반면 일부 소비재 품목은 부진했다. 관계 부처는 수출 지원책을 보완하겠다고 밝혔다."]},

const SITE = {
  menu:["홈","정치","경제","사회","국제","IT·과학","문화","연예","스포츠","오피니언","영상"],
  photo:[{t:"가상 사진: 가을 하늘 아래 억새 물결",img:""},{t:"가상 사진: 새벽 시장의 풍경",img:""}]
};
function buildSite(){
  const L=[...ARTICLES].sort((x,y)=>y.time.localeCompare(x.time));
  const feat=L.find(x=>x.featured)||L[0];
  const rest=L.filter(x=>x!==feat);
  const is=(x,...k)=>x.cat.split('·').some(c=>k.includes(c));
  const ids=(arr,n,sk=0)=>arr.slice(sk,sk+n).map(x=>x.id);
  const biz=rest.filter(x=>is(x,'정치','경제'));
  Object.assign(SITE,{
    latest:ids(L,4), headline:feat.id, sub:ids(rest,3),
    biz:ids(biz,3), bizList:ids(biz,4,3),
    soc:ids(rest.filter(x=>is(x,'사회')),3),
    ent:ids(rest.filter(x=>is(x,'연예','스포츠','문화')),4),
    cov:ids(rest.filter(x=>is(x,'취재파일')),3),
    focus:ids(L,6)
  });
}

/* 광고 렌더링 (화면이 바뀔 때마다 새로 생긴 슬롯만 처리) */
function renderAds(){
  document.querySelectorAll('.ad[data-slot]:not([data-done])').forEach(el=>{
    el.dataset.done=1;
    const a=ADS.find(x=>x.slot===el.dataset.slot);
    if(!a||a.enabled===false){el.remove();return;}
    if(a.type==="html"&&a.html){
      el.innerHTML=a.html;
      el.querySelectorAll('script').forEach(s=>{const n=document.createElement('script');[...s.attributes].forEach(t=>n.setAttribute(t.name,t.value));n.text=s.text;s.replaceWith(n)});
    }else if(a.type==="image"&&a.image){
      el.innerHTML=`<a href="${a.link||'#'}" target="_blank" rel="sponsored noopener"><img src="${a.image}" alt="${a.alt||'광고'}" width="${a.width}" height="${a.height}"></a><span class="label">광고</span>`;
    }else{
      el.innerHTML=`<div class="ad-placeholder" style="width:${a.width}px;max-width:100%;height:${a.height}px">광고 · ${a.slot} (${a.width}×${a.height})</div>`;
    }
  });
}

/* 화면 전환: #/ = 홈, #/a/아이디 = 기사 */
function route(){
  const m=location.hash.match(/^#\/a\/(.+)$/), c=location.hash.match(/^#\/c\/(.+)$/);
  $('home').hidden=!!(m||c);$('article').hidden=!m;$('cat').hidden=!c;
  if(m)renderArticle(decodeURIComponent(m[1]));
  else if(c)renderCat(decodeURIComponent(c[1]));
  else document.title='데일리뉴스';
  renderAds();window.scrollTo(0,0);
}

  try{
    const cfg=(await import('./firebase-config.js')).firebaseConfig;
    if(cfg&&cfg.apiKey&&!cfg.apiKey.includes('여기')){
      const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
      const {initializeApp}=await import(B+'firebase-app.js');
      const {getFirestore,collection,getDocs,query,orderBy,limit}=await import(B+'firebase-firestore.js');
      const db=getFirestore(initializeApp(cfg));
      const snap=await getDocs(query(collection(db,'articles'),orderBy('time','desc'),limit(30)));
      const arr=snap.docs.map(d=>{const v=d.data();return {id:d.id,cat:v.cat||'사회',t:v.t||'',s:v.s||'',time:v.time||'',rep:v.rep||'',img:v.img||'',cap:v.cap||'',featured:!!v.featured,body:Array.isArray(v.body)?v.body:[]}});
      if(arr.length)ARTICLES=arr;
    }
  }catch(e){console.warn('Firebase 불러오기 실패 - 샘플 기사 표시',e)}
  BY=Object.fromEntries(ARTICLES.map(a=>[a.id,a]));
  buildSite();renderHome();renderSide();
  window.addEventListener('hashchange',route);route();
}
start();
</script>
</body>
</html>
