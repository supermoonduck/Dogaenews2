let cache=[],editId=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
const msg=(id,t,ok)=>{$(id).textContent=t;$(id).className='msg'+(ok?' ok':'')};

$('go').onclick=async()=>{msg('lm','');try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(e){msg('lm','로그인 실패: 이메일과 비밀번호를 확인하세요.\n'+e.code)}};
$('out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$('login').hidden=!!u;$('app').hidden=!u;$('out').hidden=!u;if(u){reset();load()}});

function reset(){editId=null;$('ft').textContent='새 기사 쓰기';['rep','t','s','img','cap','body'].forEach(k=>$(k).value='');$('time').value=now();$('feat').checked=false;msg('sm','')}
$('new').onclick=reset;

async function load(){
  try{
    const snap=await getDocs(query(col,orderBy('time','desc')));
    cache=snap.docs.map(d=>({id:d.id,...d.data()}));
    $('list').innerHTML=cache.length?'':'등록된 기사가 없습니다.';
    cache.forEach(a=>{
      const r=document.createElement('div');r.className='item';
      r.innerHTML=`<span>${a.featured?'⭐ ':''}${esc(a.t)}<small>${esc(a.cat)} · ${esc(a.time)} · ${esc(a.rep||'')}</small></span><button class="g">수정</button><button class="r">삭제</button>`;
      r.children[1].onclick=()=>edit(a);
      r.children[2].onclick=async()=>{if(confirm('삭제할까요?\n'+a.t)){await deleteDoc(doc(db,'articles',a.id));load()}};
      $('list').appendChild(r);
    });
  }catch(e){$('list').textContent='불러오기 실패: '+e.code+' (규칙·로그인 확인)'}
}
function edit(a){
  editId=a.id;$('ft').textContent='기사 수정';
  $('cat').value=a.cat;$('rep').value=a.rep||'';$('time').value=a.time||'';$('t').value=a.t||'';$('s').value=a.s||'';
  $('img').value=a.img||'';$('cap').value=a.cap||'';$('body').value=(a.body||[]).join('\n');$('feat').checked=!!a.featured;
  window.scrollTo(0,0);
}
$('save').onclick=async()=>{
  const t=$('t').value.trim(),body=$('body').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(!t||!body.length){msg('sm','제목과 본문을 입력하세요.');return}
  const data={cat:$('cat').value,rep:$('rep').value.trim(),time:$('time').value.trim()||now(),t,s:$('s').value.trim(),img:$('img').value.trim(),cap:$('cap').value.trim(),body,featured:$('feat').checked};
  try{
    const ref=editId?doc(db,'articles',editId):doc(col);
    await setDoc(ref,data);
    if(data.featured)for(const o of cache)if(o.featured&&o.id!==ref.id)await setDoc(doc(db,'articles',o.id),{featured:false},{merge:true});
    msg('sm','발행했습니다.',true);reset();msg('sm','발행했습니다.',true);load();
  }catch(e){msg('sm','저장 실패: '+e.code+'\n규칙에 관리자 이메일이 맞게 들어갔는지 확인하세요.')}
};
$('imp').onclick=async()=>{
  if(!confirm('샘플 기사 21개를 추가합니다. 같은 번호가 있으면 덮어씁니다.'))return;
  try{const b=writeBatch(db);SAMPLE.forEach(a=>{const {id,...r}=a;b.set(doc(db,'articles',id),r)});await b.commit();msg('im','옮겼습니다.',true);load()}
  catch(e){msg('im','실패: '+e.code)}
};
</script></body></html>
