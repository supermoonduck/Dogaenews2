 {id:"a1",cat:"사회",t:"지역 축제 사흘간 20만 명 몰려…주변 상권 '활기'",s:"인근 상인들은 지난해보다 매출이 크게 늘었다고 입을 모았다.",time:"2026.10.13 09:12",rep:"홍길동",img:"",cap:"▲ 사진 설명이 들어가는 자리 (사진=데일리뉴스)",
  body:["지난 10일부터 사흘간 열린 지역 축제에 20만 명이 넘는 방문객이 찾은 것으로 집계됐다. 주최 측은 13일 이 같은 내용을 밝혔다.","인근 상인들은 지난해보다 매출이 크게 늘었다고 입을 모았다. 한 음식점 주인은 \"주말 내내 대기 줄이 이어졌다\"고 말했다.","주최 측은 내년에는 행사 기간을 하루 더 늘리는 방안을 검토 중이다. 주차 공간 부족과 교통 혼잡은 보완 과제로 꼽혔다.","※ 이 기사는 가상의 예시입니다."]},
 {id:"a2",cat:"사회",t:"올가을 첫 한파주의보…내일 아침 영하권",s:"중부 내륙은 기온이 영하로 떨어질 전망이다.",time:"2026.10.13 09:05",rep:"김민수",img:"",cap:"",body:["기상 당국은 내일 아침 중부 내륙을 중심으로 올가을 첫 한파주의보를 발령할 예정이라고 밝혔다.","아침 최저기온은 영하 3도에서 영상 5도 사이로 예상된다. 낮에는 기온이 올라 일교차가 15도 이상 벌어지겠다.","당국은 노약자와 어린이의 건강 관리와 농작물 냉해 예방에 신경 써 달라고 당부했다."]},
 {id:"a3",cat:"사회",t:"시내버스 노선 개편 시작, 달라지는 점은",s:"환승 체계가 단순해지고 배차 간격이 줄어든다.",time:"2026.10.13 08:48",rep:"이서연",img:"",cap:"",body:["이번 달부터 시내버스 노선이 개편됐다. 중복 구간을 줄이고 환승 체계를 단순하게 바꾸는 것이 핵심이다.","출퇴근 시간대 배차 간격은 평균 3분 줄어든다. 일부 노선은 번호가 바뀌어 이용 전 확인이 필요하다.","시는 한 달간 안내 요원을 주요 정류장에 배치해 이용객 혼선을 줄이겠다고 밝혔다."]},

 {id:"a5",cat:"경제",t:"소비자물가 석 달 만에 상승 폭 둔화",s:"농산물 가격이 안정세를 보인 영향이다.",time:"2026.10.13 08:40",rep:"최유진",img:"",cap:"",body:["이달 소비자물가 상승률이 석 달 만에 둔화한 것으로 나타났다. 농산물 가격이 안정세를 보인 영향이 컸다.","다만 외식비와 공공요금은 오름세가 이어지고 있어 체감 물가는 여전히 높다는 평가가 나온다.","전문가들은 연말까지 완만한 둔화 흐름이 이어질 것으로 내다봤다."]},
 {id:"a6",cat:"정치",t:"국회, 내일 예산안 심사 착수",s:"여야는 증액 규모를 두고 입장차를 보이고 있다.",time:"2026.10.13 08:15",rep:"정하늘",img:"",cap:"",body:["국회가 내일부터 내년도 예산안 심사에 들어간다. 여야는 복지와 연구개발 예산 증액 규모를 두고 입장차를 보이고 있다.","각 상임위원회는 부처별 예산을 차례로 살펴볼 예정이다. 처리 시한은 다음 달 말이다."]},
 {id:"a7",cat:"경제",t:"수출 증가세 이어져…반도체 호조",s:"반도체와 자동차가 전체 증가세를 이끌었다.",time:"2026.10.13 07:50",rep:"오세진",img:"",cap:"",body:["이달 들어 열흘간 수출이 전년 같은 기간보다 증가했다. 반도체와 자동차가 증가세를 이끌었다.","반면 일부 소비재 품목은 부진했다. 관계 부처는 수출 지원책을 보완하겠다고 밝혔다."]},
 {id:"a8",cat:"경제",t:"주요 기업 3분기 실적 발표 줄이어",s:"업종별로 희비가 엇갈릴 전망이다.",time:"2026.10.13 07:30",rep:"한지민",img:"",cap:"",body:["이번 주부터 주요 기업들이 3분기 실적을 잇따라 발표한다. 업종별로 희비가 엇갈릴 것이란 전망이 나온다.","시장에서는 반도체와 방산 업종의 실적 개선에 기대를 걸고 있다."]},
 {id:"a9",cat:"경제",t:"기준금리 동결 전망에 시장 관망",s:"다음 주 금융통화위원회를 앞두고 있다.",time:"2026.10.13 07:20",rep:"한지민",img:"",cap:"",body:["다음 주 금융통화위원회를 앞두고 기준금리가 동결될 것이란 전망이 우세하다.","투자자들은 물가와 환율 흐름을 지켜보며 관망세를 보이고 있다."]},

 {id:"a11",cat:"정치",t:"정당 대표 회동…민생 현안 논의",s:"물가와 일자리 대책이 주요 의제였다.",time:"2026.10.13 07:00",rep:"정하늘",img:"",cap:"",body:["여야 대표가 오늘 회동을 갖고 민생 현안을 논의했다. 물가와 일자리 대책이 주요 의제로 올랐다.","양측은 정기국회에서 관련 법안을 우선 처리하자는 데 공감대를 이뤘다."]},
 {id:"a12",cat:"사회",t:"도심 하천 정비 마무리, 주말 시민에 개방",s:"산책로와 자전거길이 새로 놓였다.",time:"2026.10.13 08:20",rep:"이서연",img:"",cap:"",body:["도심 하천 정비 사업이 마무리돼 이번 주말 시민들에게 개방된다. 산책로와 자전거길이 새로 놓였다.","시는 야간 조명도 함께 설치했다고 밝혔다. 하천 주변에는 쉼터와 운동 시설도 마련됐다."]},
 {id:"a13",cat:"사회",t:"초등학교 앞 스쿨존 단속 카메라 확대",s:"올해 안에 관내 40곳에 추가 설치된다.",time:"2026.10.13 07:55",rep:"김민수",img:"",cap:"",body:["어린이 보호구역 단속 카메라가 확대된다. 올해 안에 관내 40곳에 추가로 설치될 예정이다.","시는 사고가 잦은 곳부터 우선 설치하고 내년에 나머지 구역으로 넓힐 계획이다."]},
 {id:"a14",cat:"사회",t:"119 신고 접수 체계 개선…출동 시간 단축",s:"신고 위치를 자동으로 확인하는 시스템이 도입됐다.",time:"2026.10.13 07:30",rep:"박지훈",img:"",cap:"",body:["119 신고 접수 체계가 개선됐다. 신고자의 위치를 자동으로 확인하는 시스템이 도입돼 출동 시간이 줄어들 전망이다.","소방 당국은 시범 운영 결과 평균 출동 시간이 약 40초 단축됐다고 설명했다."]},
 {id:"a15",cat:"연예·스포츠",t:"신작 영화 개봉 첫 주말 관객 1위",s:"개봉 사흘 만에 관객 100만 명을 넘겼다.",time:"2026.10.13 08:00",rep:"윤아름",img:"",cap:"",body:["신작 영화가 개봉 첫 주말 박스오피스 1위에 올랐다. 사흘 만에 관객 100만 명을 넘겼다.","영화관 측은 가족 단위 관객이 많았다고 전했다."]},
 {id:"a16",cat:"연예·스포츠",t:"프로야구 포스트시즌 1차전 승리",s:"9회 말 역전 끝내기로 기선을 제압했다.",time:"2026.10.13 07:40",rep:"강태호",img:"",cap:"",body:["프로야구 포스트시즌 1차전에서 홈팀이 9회 말 역전 끝내기로 승리했다.","2차전은 내일 같은 장소에서 열린다."]},
 {id:"a17",cat:"연예·스포츠",t:"인기 가수 정규 앨범 발매 기념 쇼케이스",s:"타이틀곡 무대를 처음 공개했다.",time:"2026.10.13 07:20",rep:"윤아름",img:"",cap:"",body:["인기 가수가 정규 앨범 발매를 기념해 쇼케이스를 열고 타이틀곡 무대를 처음 공개했다.","가수는 \"오랜 시간 준비한 앨범인 만큼 많이 들어 주시면 좋겠다\"고 말했다."]},
 {id:"a18",cat:"연예·스포츠",t:"국가대표 평가전 명단 발표",s:"신예 선수 세 명이 처음 발탁됐다.",time:"2026.10.13 07:00",rep:"강태호",img:"",cap:"",body:["축구 국가대표팀이 이달 평가전에 나설 명단을 발표했다. 신예 선수 세 명이 처음 발탁됐다.","감독은 \"경쟁력을 점검하는 기회로 삼겠다\"고 말했다."]},
 {id:"a19",cat:"취재파일",t:"[취재파일] 달라진 출근길, 현장을 가 보니",s:"버스 노선 개편 첫 주의 풍경을 담았다.",time:"2026.10.13 06:50",rep:"이서연",img:"",cap:"",body:["노선 개편 첫 출근길, 정류장에는 새 노선도를 살피는 시민들이 눈에 띄었다.","\"번호가 바뀐 줄 모르고 한참 기다렸다\"는 시민도 있었다. 현장에서 본 문제점과 개선점을 정리했다."]},
 {id:"a20",cat:"취재파일",t:"[취재파일] 전통시장 디지털 전환의 명암",s:"온라인 주문을 도입한 시장 상인들을 만났다.",time:"2026.10.13 06:40",rep:"최유진",img:"",cap:"",body:["전통시장에 온라인 주문과 배달 서비스가 도입되고 있다. 매출이 늘었다는 상인도, 부담이 커졌다는 상인도 있었다.","현장 목소리를 통해 지원 방향을 짚어 본다."]},
 {id:"a21",cat:"취재파일",t:"[취재파일] 학교 급식 현장의 하루",s:"새벽 6시, 조리실의 하루가 시작된다.",time:"2026.10.13 06:30",rep:"박지훈",img:"",cap:"",body:["새벽 6시, 학교 조리실에 불이 켜진다. 수백 명분의 식사를 준비하는 하루가 시작된다.","조리 종사자들은 폭염과 인력 부족을 가장 큰 어려움으로 꼽았다."]}
];

$('go').onclick=async()=>{msg('lm','');try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(e){msg('lm','로그인 실패: 이메일과 비밀번호를 확인하세요.\n'+e.code)}};
$('out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$('login').hidden=!!u;$('app').hidden=!u;$('out').hidden=!u;if(u){reset();load()}});

function reset(){editId=null;$('ft').textContent='새 기사 쓰기';['rep','t','s','img','cap','body'].forEach(k=>$(k).value='');$('time').value=now();$('feat').checked=false;msg('sm','')}
$('new').onclick=reset;

async function load(){
  try{
    const snap=await getDocs(query(col,orderBy('time','desc')));
    cache=snap.docs.map(d=>({id:d.id,...d.data()}));
    $('list').innerHTML=cache.length?'':'등록된 기사가 없습니다.';
    cache.forEach(a=>{
      const r=document.createElement('div');r.className='item';
      r.innerHTML=`<span>${a.featured?'⭐ ':''}${esc(a.t)}<small>${esc(a.cat)} · ${esc(a.time)} · ${esc(a.rep||'')}</small></span><button class="g">수정</button><button class="r">삭제</button>`;
      r.children[1].onclick=()=>edit(a);
      r.children[2].onclick=async()=>{if(confirm('삭제할까요?\n'+a.t)){await deleteDoc(doc(db,'articles',a.id));load()}};
      $('list').appendChild(r);
    });
  }catch(e){$('list').textContent='불러오기 실패: '+e.code+' (규칙·로그인 확인)'}
}
function edit(a){
  editId=a.id;$('ft').textContent='기사 수정';
  $('cat').value=a.cat;$('rep').value=a.rep||'';$('time').value=a.time||'';$('t').value=a.t||'';$('s').value=a.s||'';
  $('img').value=a.img||'';$('cap').value=a.cap||'';$('body').value=(a.body||[]).join('\n');$('feat').checked=!!a.featured;
  window.scrollTo(0,0);
}
$('save').onclick=async()=>{
  const t=$('t').value.trim(),body=$('body').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(!t||!body.length){msg('sm','제목과 본문을 입력하세요.');return}
  const data={cat:$('cat').value,rep:$('rep').value.trim(),time:$('time').value.trim()||now(),t,s:$('s').value.trim(),img:$('img').value.trim(),cap:$('cap').value.trim(),body,featured:$('feat').checked};
  try{
    const ref=editId?doc(db,'articles',editId):doc(col);
    await setDoc(ref,data);
    if(data.featured)for(const o of cache)if(o.featured&&o.id!==ref.id)await setDoc(doc(db,'articles',o.id),{featured:false},{merge:true});
    msg('sm','발행했습니다.',true);reset();msg('sm','발행했습니다.',true);load();
  }catch(e){msg('sm','저장 실패: '+e.code+'\n규칙에 관리자 이메일이 맞게 들어갔는지 확인하세요.')}
};
$('imp').onclick=async()=>{
  if(!confirm('샘플 기사 21개를 추가합니다. 같은 번호가 있으면 덮어씁니다.'))return;
  try{const b=writeBatch(db);SAMPLE.forEach(a=>{const {id,...r}=a;b.set(doc(db,'articles',id),r)});await b.commit();msg('im','옮겼습니다.',true);load()}
  catch(e){msg('im','실패: '+e.code)}
};
</script></body></html>
